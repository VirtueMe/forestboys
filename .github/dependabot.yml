version: 2

updates:
  # App, Pages Functions and scripts: everything in the root package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    labels: [chore]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # One PR per week for everything that is not a major bump.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Oslo
    labels: [ci]
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']

  # Local Neo4j for development. A major bump changes the on-disk format,
  # so those are done by hand.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    labels: [chore]
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: neo4j
        update-types: ['version-update:semver-major']
