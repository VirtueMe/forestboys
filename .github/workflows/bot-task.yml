name: Bot task — proposal generation

on:
  issues:
    types: [opened, labeled]

# Serialize all Claude-driven work through one bucket so we don't burn
# rate-limit budget across parallel issues. bot-deny-analysis joins the
# same group when that workflow lands.
concurrency:
  group: claude-bot
  cancel-in-progress: false

permissions:
  contents: read       # checkout + read prompts/SCHEMA
  issues:  write       # comment + close on success

jobs:
  generate:
    if: contains(github.event.issue.labels.*.name, 'bot-task')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Parse issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, sys

          body = os.environ['ISSUE_BODY']

          # Extract the first ```json fence — that's the request payload.
          # The bot-task.md template + functions/api/proposals/request.ts
          # both put it as the first fenced block; .github/ISSUE_TEMPLATE/...
          # is the canonical contract.
          match = re.search(r'```json\s*\n(.*?)\n```', body, re.DOTALL)
          if not match:
              print('::error::No ```json fence found in issue body', file=sys.stderr)
              sys.exit(1)

          try:
              req = json.loads(match.group(1))
          except json.JSONDecodeError as e:
              print(f'::error::Issue payload is not valid JSON: {e}', file=sys.stderr)
              sys.exit(1)

          required = ['entityId', 'kind', 'slug', 'blockPath', 'outlineId', 'outlineRev', 'sectionPath', 'promptHash']
          missing = [k for k in required if k not in req]
          if missing:
              print(f'::error::Missing required fields: {missing}', file=sys.stderr)
              sys.exit(1)

          # Stash payload as a file for later steps + emit individual outputs
          with open('/tmp/req.json', 'w') as f:
              json.dump(req, f)

          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              for k in required:
                  f.write(f'{k}={req[k]}\n')
          PYEOF

      - name: Build fixture for the prompt
        id: fixture
        env:
          ENTITY_ID:    ${{ steps.parse.outputs.entityId }}
          ENTITY_KIND:  ${{ steps.parse.outputs.kind }}
          BLOCK_PATH:   ${{ steps.parse.outputs.blockPath }}
          OUTLINE_ID:   ${{ steps.parse.outputs.outlineId }}
          OUTLINE_REV:  ${{ steps.parse.outputs.outlineRev }}
          SECTION_PATH: ${{ steps.parse.outputs.sectionPath }}
          PROMPT_HASH:  ${{ steps.parse.outputs.promptHash }}
        run: |
          # v1 — entity context, similar accepts, similar denials are all
          # empty placeholders. Wire these up to /api/entity/<kind>/<slug>/context
          # and the corpus endpoints once they exist.
          python3 << 'PYEOF'
          import os, json
          fixture = {
              'vars': {
                  'ENTITY_ID':            os.environ['ENTITY_ID'],
                  'ENTITY_KIND':          os.environ['ENTITY_KIND'],
                  'BLOCK_PATH':           os.environ['BLOCK_PATH'],
                  'OUTLINE_ID':           os.environ['OUTLINE_ID'],
                  'OUTLINE_REV':          os.environ['OUTLINE_REV'],
                  'SECTION_PATH':         os.environ['SECTION_PATH'],
                  'PROMPT_HASH':          os.environ['PROMPT_HASH'],
                  'ENTITY_CONTEXT_JSON':  { 'id': os.environ['ENTITY_ID'], 'kind': os.environ['ENTITY_KIND'], 'note': 'context fetch not yet wired — see docs/PROPOSALS.md phase 6 followup' },
                  'OUTLINE_SECTION_JSON': { 'outlineId': os.environ['OUTLINE_ID'], 'sectionPath': os.environ['SECTION_PATH'], 'note': 'outline body fetch not yet wired' },
                  'SIMILAR_ACCEPTS_JSON': [],
                  'SIMILAR_DENIALS_JSON': [],
              },
              'outputFile': f"proposal-block-{os.environ['ENTITY_ID'].replace(':', '-')}-{os.environ['BLOCK_PATH'].replace('.', '-')}.json",
          }
          with open('/tmp/fixture.json', 'w') as f:
              json.dump(fixture, f)
          # The output filename for ingest
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"output_path=/tmp/{fixture['outputFile']}\n")
          PYEOF

      - name: Render prompt
        id: render
        env:
          OUTPUT_PATH: ${{ steps.fixture.outputs.output_path }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, sys

          tmpl = open('scripts/prompts/proposal-block.txt').read()
          fixture = json.load(open('/tmp/fixture.json'))
          vars_ = { **fixture['vars'], 'OUTPUT_PATH': os.environ['OUTPUT_PATH'] }

          def sub(match):
              key = match.group(1)
              if key not in vars_:
                  print(f'::error::Template references undefined variable: {key}', file=sys.stderr)
                  sys.exit(1)
              v = vars_[key]
              return v if isinstance(v, str) else json.dumps(v, indent=2)

          rendered = re.sub(r'\$\{([A-Z_][A-Z0-9_]*)\}', sub, tmpl)
          with open('/tmp/prompt.txt', 'w') as f:
              f.write(rendered)
          PYEOF

          # Pass the rendered prompt to the next step via output
          {
            echo "prompt<<PROMPT_EOF"
            cat /tmp/prompt.txt
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--allowedTools Read,Write"
          prompt: ${{ steps.render.outputs.prompt }}

      - name: Validate output
        env:
          OUTPUT_PATH: ${{ steps.fixture.outputs.output_path }}
        run: |
          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "::error::Claude did not write $OUTPUT_PATH"
            exit 1
          fi
          # Loose schema check — full validation lives in the ingest endpoint
          jq -e 'has("entityId") and has("blockPath") and has("newValue") and has("derivedFrom")' "$OUTPUT_PATH" > /dev/null \
            || jq -e '.skip == true and (.reason | type == "string")' "$OUTPUT_PATH" > /dev/null \
            || { echo "::error::Output failed minimal shape check"; cat "$OUTPUT_PATH"; exit 1; }

      - name: Skip — proposal opted out
        id: skip_check
        env:
          OUTPUT_PATH: ${{ steps.fixture.outputs.output_path }}
        run: |
          if jq -e '.skip == true' "$OUTPUT_PATH" > /dev/null 2>&1; then
            REASON=$(jq -r '.reason' "$OUTPUT_PATH")
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=$REASON" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: POST to ingest
        if: steps.skip_check.outputs.skipped == 'false'
        env:
          OUTPUT_PATH:        ${{ steps.fixture.outputs.output_path }}
          INGEST_URL:         ${{ vars.PROPOSAL_INGEST_URL }}
          BOT_INGEST_SECRET:  ${{ secrets.BOT_INGEST_SECRET }}
          ISSUE_NUMBER:       ${{ github.event.issue.number }}
        run: |
          python3 << 'PYEOF'
          import os, json, hmac, hashlib, urllib.request, urllib.error, sys

          body_bytes = open(os.environ['OUTPUT_PATH'], 'rb').read()
          # Augment with issue metadata so the ingest comment can link back
          payload = json.loads(body_bytes)
          payload['issueNumber'] = int(os.environ['ISSUE_NUMBER'])
          body_bytes = json.dumps(payload, separators=(',', ':')).encode()

          secret = os.environ['BOT_INGEST_SECRET'].encode()
          sig = 'sha256=' + hmac.new(secret, body_bytes, hashlib.sha256).hexdigest()

          req = urllib.request.Request(
              os.environ['INGEST_URL'],
              data=body_bytes,
              method='POST',
              headers={
                  'Content-Type':           'application/json',
                  'X-Hub-Signature-256':    sig,
                  'User-Agent':             'milorg-bot-task/1.0',
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"ingest {resp.status}: {resp.read().decode()}")
          except urllib.error.HTTPError as e:
              print(f"::error::ingest failed {e.code}: {e.read().decode()}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Comment + close issue (skipped)
        if: steps.skip_check.outputs.skipped == 'true'
        env:
          GH_TOKEN:     ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REASON:       ${{ steps.skip_check.outputs.skip_reason }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Bot opted out of generating a proposal: $REASON"
          gh issue close "$ISSUE_NUMBER"

      # Closing on successful ingest is the ingest endpoint's responsibility
      # (it has the R2 path to comment with). On failure the issue stays open
      # with the workflow's failure log so it can be re-run.
