name: Sanity → graph sync (daily)

# Carries Jan's Sanity edits into the production graph (docs/SANITY-SYNC.md)
# and keeps the Aura Free instance alive — it is deleted after a period
# without writes. The heartbeat runs whatever the syncs did.
#
# CI has no data/: the baseline a sync compares against is the stamps on the
# nodes (`--stamp`, docs/SANITY-SYNC.md), not a file. Each run keeps its plans
# and the undo snapshots as an artifact.
#
# Run it by hand (Actions → Run workflow) with «write» unticked for a dry run
# that only reads production.
#
# Scheduled workflows run from the default branch — main, the Neo4j app.

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      write:
        description: 'Apply the changes. Untick for a dry run that only reads production.'
        type: boolean
        default: true

concurrency:
  group: sanity-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_NEO4J_URI:      ${{ secrets.PRODUCTION_NEO4J_URI }}
      PRODUCTION_NEO4J_USERNAME: ${{ secrets.PRODUCTION_NEO4J_USERNAME }}
      PRODUCTION_NEO4J_PASSWORD: ${{ secrets.PRODUCTION_NEO4J_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # A step that fails stays red in the run, and the later steps still run
      # (!cancelled()): the event sync does not depend on the person sync, and
      # the heartbeat must run whatever the syncs did.
      - name: Person sync
        run: npx tsx scripts/sync/sync-person.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # Before the events: a transport new in Sanity must have its node when an event links it.
      - name: Transport sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-transport.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      - name: Event sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-event.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      - name: Description sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-description.ts --type=all --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # The site's list of pages (sitemap.txt, 404 check) is rebuilt on the site's own writes; these syncs write to the
      # graph directly, so ask it to rebuild once they are done (#220).
      - name: Rebuild the sitemap
        if: ${{ !cancelled() }}
        env:
          SITE_URL:          ${{ secrets.SITE_URL }}
          BOT_INGEST_SECRET: ${{ secrets.BOT_INGEST_SECRET }}
        run: npx tsx scripts/sync/rebuild-sitemap.ts ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      - name: Heartbeat
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/heartbeat.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # The plans, and the snapshots a write takes first, so a run can be undone.
      - name: Keep the plans and the undo snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sync-plans-and-snapshots
          path: data/sanity-delta/
          if-no-files-found: ignore
          retention-days: 30
