name: Sanity → graph sync (daily)

# Carries Jan's Sanity edits into the production graph (docs/SANITY-SYNC.md)
# and keeps the Aura Free instance alive — it is deleted after a period
# without writes. The heartbeat runs whatever the syncs did.
#
# CI has no data/: the baseline a sync compares against is the stamps on the
# nodes (`--stamp`, docs/SANITY-SYNC.md), not a file. Each run keeps its plans
# and the undo snapshots as an artifact.
#
# Run it by hand (Actions → Run workflow) with «write» unticked for a dry run
# that only reads production.
#
# Scheduled workflows run from the default branch — main, the Neo4j app.

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      write:
        description: 'Apply the changes. Untick for a dry run that only reads production.'
        type: boolean
        default: true

concurrency:
  group: sanity-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_NEO4J_URI:      ${{ secrets.PRODUCTION_NEO4J_URI }}
      PRODUCTION_NEO4J_USERNAME: ${{ secrets.PRODUCTION_NEO4J_USERNAME }}
      PRODUCTION_NEO4J_PASSWORD: ${{ secrets.PRODUCTION_NEO4J_PASSWORD }}
      # The photo copy below (#413): the IMAGES bucket over S3, and the token for Sanity's originals.
      R2_ACCOUNT_ID:             ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID:          ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY:      ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_IMAGES_BUCKET:          ${{ secrets.R2_IMAGES_BUCKET }}
      SANITY_READ_TOKEN:         ${{ secrets.SANITY_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # cjxl/djxl make the JPEG XL masters of the photo copy; without them a photo is kept as its original bytes.
      - name: Install JPEG XL tools
        run: sudo apt-get update && sudo apt-get install -y libjxl-tools

      # A step that fails stays red in the run, and the later steps still run
      # (!cancelled()): the event sync does not depend on the person sync, and
      # the heartbeat must run whatever the syncs did.
      - name: Person sync
        run: npx tsx scripts/sync/sync-person.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # Before the events: a transport new in Sanity must have its node when an event links it.
      - name: Transport sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-transport.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # Before the events too: a location new in Sanity must have its node when an event links it (#296).
      - name: Location sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-location.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # The same for stations, which events link with FROM_STATION / TO_STATION (#297).
      - name: Station sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-station.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # An outline's node, title, mentions and gallery (#301); before the link and description syncs, which need the node.
      # It requests no bundle: a changed outline is `stale` and the admin's «request a bundle» makes the new one.
      - name: Outline sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-outline.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # Their links (#118; an outline's too, #301), after the nodes exist and before the events.
      - name: Link sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-link.ts --type=all --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # An organization or district new in Sanity must have its node when an event links it (#300).
      - name: Organization and district sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-org.ts --type=all --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      - name: Event sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-event.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      - name: Description sync
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/sync-description.ts --type=all --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # Photos and description links that arrived from Sanity on its CDN go to our bucket (#413, epic #405). After every
      # sync that can bring one in; reads the copied-list once and writes it once. A failed photo keeps its Sanity
      # address and is tried again tomorrow, and the step is red.
      - name: Copy new photos to our bucket
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/backfill-images.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # The site's list of pages (sitemap.txt, 404 check) is rebuilt on the site's own writes; these syncs write to the
      # graph directly, so ask it to rebuild once they are done (#220).
      - name: Rebuild the sitemap
        if: ${{ !cancelled() }}
        env:
          SITE_URL:          ${{ secrets.SITE_URL }}
          BOT_INGEST_SECRET: ${{ secrets.BOT_INGEST_SECRET }}
        run: npx tsx scripts/sync/rebuild-sitemap.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      - name: Heartbeat
        if: ${{ !cancelled() }}
        run: npx tsx scripts/sync/heartbeat.ts --production ${{ (github.event_name == 'schedule' || inputs.write) && '--write' || '' }}

      # The plans, and the snapshots a write takes first, so a run can be undone.
      - name: Keep the plans and the undo snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sync-plans-and-snapshots
          path: data/sanity-delta/
          if-no-files-found: ignore
          retention-days: 30
