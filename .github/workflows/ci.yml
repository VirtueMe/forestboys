name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR supersedes the running check.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` is `vue-tsc -b && vite build`; vue-tsc also
      # type-checks functions/, which is what Cloudflare Pages compiles.
      - name: Type-check and build
        run: npm run build
        env:
          VITE_SANITY_PROJECT_ID: ${{ vars.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET }}

      # The harness pages for the e2e tests (#129, #139) are dev-only; the build has one entry, index.html.
      # This fails if any of them ever gets into the build. A new harness page names itself here.
      - name: The e2e harness is not in the build
        run: |
          if grep -rlE '__harness|Editor harness|Contrast harness|Outline harness|Description harness' dist; then
            echo "::error::an e2e harness page is in the build"
            exit 1
          fi

  # End-to-end tests (#129). An ordinary job: Playwright installs the Chromium that belongs to the
  # @playwright/test that npm ci installed, so there is no image or tag to keep in step with the package.
  # Only the headless shell, which is what the tests run in: measured on a clean Debian, the install takes
  # 20 s (31 s with the full Chromium) and the browser is 269 MB (662 MB), most of it apt and download that
  # a cache would not save. If the install grows, cache ~/.cache/ms-playwright by Playwright version.
  #
  # The ruleset «Protect main» (Settings → Rules) requires this check by its NAME, «End-to-end (Playwright)»
  # (#149). Renaming the job leaves every PR waiting for a check that never reports, until the ruleset is
  # changed to the new name. Change both together.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install the headless Chromium and the libraries it needs
        run: npx playwright install --with-deps --only-shell chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # A test that failed and passed on the retry leaves the job green. This lists those in the job's summary
      # and as warnings, so they are looked at (#149). It never fails the job: not for flaky tests, and not if
      # the report itself is missing or the script breaks.
      - name: Flaky tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/e2e/flaky-summary.ts test-results/e2e-report.json

      # The report has the traces of failed tests (open one with `npx playwright show-trace`).
      - name: Keep the report and the traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
