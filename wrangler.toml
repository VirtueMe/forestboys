name = "forestboys"
compatibility_date = "2024-01-01"

# Without this, Cloudflare Pages skips this file («A Wrangler configuration file was found but it does not appear to be
# valid… make sure the file is valid and contains the `pages_build_output_dir` property») and the production site's
# bindings are whatever someone set by hand in the dashboard (#174). With it, this file is the source of truth for
# bindings and plain variables; secrets stay in the dashboard.
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "milorg_users"
database_name = "milorg-users"
database_id = "c84e9e9e-47aa-4dc0-9e6d-fc7ab7497326"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "milorg-images"

[[r2_buckets]]
binding = "PROPOSALS"
bucket_name = "milorg-proposals"

# The live-update Durable Object (#181): a review page updates when a bundle arrives. The class lives in a separate
# worker, `milorg-bundle-events` (workers/bundle-events), which has to exist first: `npm run deploy:do`. This only binds
# to it. A binding to a worker that does not exist can fail the whole deployment. See docs/CLOUDFLARE.md.
[[durable_objects.bindings]]
name        = "BUNDLE_EVENTS"
class_name  = "BundleEventsDO"
script_name = "milorg-bundle-events"

[vars]
# GitHub OAuth App "MILORG CLOUDFLARE" (#14) — the client id is public; GITHUB_CLIENT_SECRET
# is a Cloudflare secret (Production + Preview), never here. Locally .dev.vars overrides
# both with the 127.0.0.1 app.
GITHUB_CLIENT_ID = "Ov23li62h3a4NAutaB7P"

# The two build-time values the client reads (src: import.meta.env.VITE_SANITY_*, vite.config.ts: the dev proxy). With
# this file valid, Pages builds from these and ignores the dashboard's variables, so a value left only in the dashboard
# is missing from the bundle. Both are public (the project id is in every Sanity URL the site calls). The VITE_NEO4J_*
# values in the dashboard are read by nothing in src or functions. Remove a name from the dashboard when it is here: a
# name defined in both fails the deployment («Binding name … already in use»).
VITE_SANITY_PROJECT_ID = "7r6kqtqy"
VITE_SANITY_DATASET    = "production"
