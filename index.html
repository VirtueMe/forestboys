<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F4EFE4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1A17" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Milorg 2 Utforsker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
    />
    <script>
      // Decode SPA redirect from 404.html
      (function () {
        var p = window.location.search.slice(1).split('&').filter(function (s) { return s.startsWith('p=') })[0]
        if (p) window.history.replaceState(null, null, '/' + decodeURIComponent(p.slice(2)))
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
