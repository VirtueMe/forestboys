<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="404 – Siden ble ikke funnet">
  <!-- Background -->
  <rect width="800" height="500" fill="#F7F5F1"/>

  <!-- Faded flag cross motif -->
  <g opacity="0.06">
    <rect x="330" y="-100" width="140" height="700" fill="#BA0C2F"/>
    <rect x="-100" y="158" width="1000" height="140" fill="#BA0C2F"/>
  </g>

  <!-- Small flag mark, top-centre -->
  <g transform="translate(376,50)">
    <rect width="48" height="48" fill="#BA0C2F"/>
    <rect x="13" y="0" width="9" height="48" fill="#FFFFFF"/>
    <rect x="0" y="19" width="48" height="9" fill="#FFFFFF"/>
    <rect x="16" y="0" width="3" height="48" fill="#00205B"/>
    <rect x="0" y="22" width="48" height="3" fill="#00205B"/>
  </g>

  <!-- 404 headline -->
  <text x="400" y="270" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="120" font-weight="bold" fill="#1A1A1A"
        letter-spacing="4">404</text>

  <!-- Divider -->
  <rect x="360" y="300" width="80" height="3" fill="#BA0C2F"/>

  <!-- Message -->
  <text x="400" y="350" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="26" fill="#1A1A1A">
    Siden ble ikke funnet
  </text>

  <text x="400" y="388" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17" font-style="italic" fill="#666666">
    Denne adressen finnes ikke i arkivet vårt.
  </text>

  <!-- Return link -->
  <g transform="translate(400,430)">
    <a href="/">
      <rect x="-140" y="-20" width="280" height="44" rx="2"
            fill="#BA0C2F"/>
      <text x="0" y="8" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="17" fill="#FFFFFF" letter-spacing="1">
        TILBAKE TIL FORSIDEN
      </text>
    </a>
  </g>
</svg>