name = "milorg-image-maker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# No public address: only the Pages project's service binding (IMAGE_MAKER) reaches it, so it takes no login.
workers_dev  = false
preview_urls = false

# The Cloudflare Images binding. Pages cannot have it (#410), so this worker holds it. Two transformations per upload.
[images]
binding = "IMAGES"
